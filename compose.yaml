services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: depradar
      MYSQL_USER: depradar
      MYSQL_PASSWORD: ${DB_PASSWORD:-depradar-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D depradar -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: depradar
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:-depradar-local}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/depradar?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_PASSWORD: ${DB_PASSWORD:-depradar-local}
      REDIS_HOST: redis
      MQ_HOST: rabbitmq
      MQ_PASSWORD: ${MQ_PASSWORD:-depradar-local}
      OSV_MODE: ${OSV_MODE:-replay}
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
  rabbit-data:
